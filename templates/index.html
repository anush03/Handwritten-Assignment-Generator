<!DOCTYPE html>
<html>
<head>
    <title>Handwritten Assignment Generator</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
            text-align: center;
        }
        textarea {
            width: 80%;
            height: 200px;
            padding: 15px;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        a {
            display: block;
            margin-top: 25px;
            font-size: 18px;
            color: green;
            font-weight: bold;
        }
        select {
            padding: 8px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<h2>✍️ Handwritten Assignment Generator</h2>

<form method="POST">
  <textarea name="text" placeholder="Paste your assignment text here..." required></textarea>

  <br><br>

  <label><b>Select Handwriting Style:</b></label><br>
  <select name="font" required>
      <option value="patrick">Patrick Hand (Clean)</option>
      <option value="caveat">Caveat (Casual)</option>
      <option value="dancing">Dancing Script (Stylish)</option>
  </select>

  <br><br>
  <button type="submit">Generate Handwritten Assignment</button>
</form>


{% if pdf_ready %}
    <a href="/download">📄 Download Assignment PDF</a>
{% endif %}

</body>
</html>
